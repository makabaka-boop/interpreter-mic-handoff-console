server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 纯前端校验台：不设任何代理/上游接口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
