# 同声传译麦克风切换校验台 —— 纯前端，无后端依赖。
#
# 发布页面（WEB_PORT 可覆盖，默认 8080）：
#   WEB_PORT=9000 docker compose up --build web
#
# 一次性验收（类型检查 + Vitest 单元测试 + 构建 + Playwright 授权流程 e2e），
# 成功即退出：
#   docker compose build verify
#   docker compose run --rm verify

services:
  web:
    build:
      context: .
      target: web
    image: si-mic-switch-console:web
    ports:
      # 宿主机端口可用 WEB_PORT 覆盖；容器内固定 8080
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  verify:
    build:
      context: .
      target: verify
    image: si-mic-switch-console:verify
    environment:
      # 容器内以 root 运行 Chromium 需要关闭沙箱
      CI: "true"
    # 一次性服务：跑完验收即退出（restart: "no"）
    restart: "no"
    profiles:
      - verify
